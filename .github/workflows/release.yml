name: Release

# A version tag publishes a GitHub release. Running it by hand rehearses: it
# builds, signs when it can, and keeps the zips as workflow artifacts, but
# publishes nothing unless dry_run is turned off.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and sign, but publish nothing
        type: boolean
        default: true

# Nothing by default; the job asks for what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    # The signing secrets live in this environment, so only this job can
    # read them.
    environment: release
    permissions:
      contents: write # Publishes the release.
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
      MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        id: version
        run: |
          source version.env
          echo "version=$MARKETING_VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$MARKETING_VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version.env's $MARKETING_VERSION"
            exit 1
          fi

      - name: Signing identity
        id: signing
        run: |
          if [[ -n "$MACOS_SIGNING_P12" && -n "$MACOS_SIGNING_P12_PASSWORD" && -n "$ASC_KEY_ID" && -n "$ASC_ISSUER_ID" && -n "$ASC_PRIVATE_KEY_P8" ]]; then
            echo "identity=$(Scripts/setup_keychain.sh)" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Not signed::The signing secrets are not set, so this build is signed ad hoc and not notarized. The release notes say so."
          fi

      - name: Build, and sign and notarize when possible
        env:
          DEVELOPER_ID_APPLICATION: ${{ steps.signing.outputs.identity }}
        run: Scripts/build_release.sh

      - name: Release notes
        run: Scripts/release_notes.sh "${{ steps.version.outputs.version }}" > dist/notes.md

      - name: Keep the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.version.outputs.version }}
          path: |
            dist/*.zip
            dist/notes.md

      - name: Publish
        if: github.ref_type == 'tag' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source version.env
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$PRODUCT_NAME $MARKETING_VERSION" --notes-file dist/notes.md

      - name: Remove the keychain
        if: always()
        run: Scripts/setup_keychain.sh --delete
