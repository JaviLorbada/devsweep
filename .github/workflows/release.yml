name: Release

# A version tag publishes a GitHub release, with the appcast the app looks
# for updates in. Running it by hand rehearses: it builds, signs when it
# can, writes the appcast, and keeps them as workflow artifacts, but
# publishes nothing unless dry_run is turned off.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and sign, but publish nothing
        type: boolean
        default: true

# Nothing by default; the job asks for what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    # Apple's notary service can take hours on a new account's first
    # submissions (the first took almost six); the build waits for it, up to
    # just under the six hours GitHub gives a job.
    timeout-minutes: 350
    # The signing secrets live in this environment, so only this job can
    # read them.
    environment: release
    permissions:
      contents: write # Publishes the release.
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
      MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app

      - name: Version
        id: version
        run: |
          source version.env
          echo "version=$MARKETING_VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$MARKETING_VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version.env's $MARKETING_VERSION"
            exit 1
          fi

      - name: Signing identity
        id: signing
        run: |
          if [[ -n "$MACOS_SIGNING_P12" && -n "$MACOS_SIGNING_P12_PASSWORD" && -n "$ASC_KEY_ID" && -n "$ASC_ISSUER_ID" && -n "$ASC_PRIVATE_KEY_P8" ]]; then
            # With the secrets set, a certificate that won't import stops the
            # release rather than shipping an ad hoc build.
            identity="$(Scripts/setup_keychain.sh)"
            if [[ -z "$identity" ]]; then
              echo "::error title=Not signed::The signing secrets are set, but no Developer ID identity came out of the certificate."
              exit 1
            fi
            echo "identity=$identity" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Not signed::The signing secrets are not set, so this build is signed ad hoc and not notarized. The release notes say so."
          fi

      - name: Build, and sign and notarize when possible
        env:
          DEVELOPER_ID_APPLICATION: ${{ steps.signing.outputs.identity }}
        run: Scripts/build_release.sh

      - name: Release notes
        run: Scripts/release_notes.sh "${{ steps.version.outputs.version }}" > dist/notes.md

      # The feed every installed DevSweep reads, at the latest release's
      # appcast.xml: the app zip, signed with the EdDSA key whose public half
      # is in the app. Only this step sees the key. A release without one, or
      # with an app that isn't notarized, would leave every copy without its
      # next update, so a tag stops here instead.
      - name: Appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          source version.env
          problem=""
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            problem="SPARKLE_PRIVATE_KEY is not set"
          elif [[ "$(cat dist/signing.txt)" != "notarized" ]]; then
            problem="the app isn't notarized, and an update has to be"
          fi
          if [[ -z "$problem" ]]; then
            Scripts/appcast.sh "dist/$PRODUCT_NAME-$VERSION.zip" \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "::error title=No appcast::$problem, so there is no appcast, and installed copies would find no update."
            exit 1
          else
            echo "::notice title=No appcast::$problem, so this rehearsal writes no appcast."
          fi

      - name: Keep the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.version.outputs.version }}
          path: |
            dist/*.zip
            dist/appcast.xml
            dist/notes.md

      - name: Publish
        if: github.ref_type == 'tag' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source version.env
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/appcast.xml \
            --title "$PRODUCT_NAME $MARKETING_VERSION" --notes-file dist/notes.md

      - name: Remove the keychain
        if: always()
        run: Scripts/setup_keychain.sh --delete
