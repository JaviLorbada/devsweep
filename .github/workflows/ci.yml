name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: SwiftFormat
        run: docker run --rm -v "$PWD:/work" -w /work ghcr.io/nicklockwood/swiftformat:0.64.0 Sources Tests --lint
      - name: SwiftLint
        run: docker run --rm -v "$PWD:/work" -w /work ghcr.io/realm/swiftlint:0.65.1 swiftlint --strict --no-cache

  test:
    name: Build and test
    # The newest GitHub-hosted image with a released Xcode 26 or later.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -version && swift --version
      - run: swift build
      - run: swift test --parallel

  acceptance:
    name: Parity with the bash script
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: The bash script and its bats suite, at a pinned commit
        uses: actions/checkout@v5
        with:
          repository: JaviLorbada/dotfiles
          ref: ce495ec4fc15b57086f30b7dbb60cf43c5c5f0a9
          path: dotfiles
      - run: brew install bats-core
      - name: The bats suite against the Swift binary
        run: Scripts/bats.sh "$PWD/dotfiles"
      - name: The script and the binary side by side
        run: RUN=1 Scripts/compare.sh "$PWD/dotfiles"
