name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read only: CI checks the code and publishes nothing.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a commit, with the release it is in a comment, so a
# moved tag can't change what runs.
jobs:
  lint:
    name: Lint
    # Pinned: ubuntu-latest moves to a new Ubuntu on GitHub's schedule.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SwiftFormat
        run: docker run --rm -v "$PWD:/work" -w /work ghcr.io/nicklockwood/swiftformat:0.64.0 Sources Tests --lint
      - name: SwiftLint
        run: docker run --rm -v "$PWD:/work" -w /work ghcr.io/realm/swiftlint:0.65.1 swiftlint --strict --no-cache

  test:
    name: Build and test
    # GitHub's Xcode 27 image, with Xcode 27.2 picked by path, so a new
    # default on the image can't change what builds DevSweep.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - run: xcodebuild -version && swift --version
      # Built on its own, at the usual verbosity: under --quiet, SwiftPM prints
      # "Build failed" without the compiler's errors.
      - name: Build, with warnings as errors
        run: swift build --build-tests -Xswiftc -warnings-as-errors
      # Quiet prints the failures and the totals, not a line or two per test.
      # Every event also goes to a file, in a schema pinned by version, for the
      # report. The time limit turns a hang into a failure the report can name.
      - name: Test
        timeout-minutes: 10
        shell: bash # With pipefail, so tee can't hide a failure.
        run: >
          swift test --skip-build --parallel --quiet
          --event-stream-output-path "$RUNNER_TEMP/tests.jsonl"
          --event-stream-version 6.4
          2>&1 | tee "$RUNNER_TEMP/tests.log"
      # Each failure as an annotation on its line, and a table on the run's
      # summary page. It runs when the tests fail, which is when it matters,
      # and fails itself only when it can't read the events, as after a new
      # Xcode changes their format.
      - name: Report the tests
        if: ${{ !cancelled() }}
        run: Scripts/test_report.sh "$RUNNER_TEMP/tests.jsonl" "$RUNNER_TEMP/tests.log"
      - name: Release build, as a release ships it
        run: swift build -c release -Xswiftc -warnings-as-errors

  acceptance:
    name: Parity with the bash script
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The bash script and its bats suite, at a pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JaviLorbada/dotfiles
          ref: 500a27250420cc82e1312187901dd77fcfb3669d
          path: dotfiles
          persist-credentials: false
      - name: Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - run: brew install bats-core
      - name: The bats suite against the Swift binary
        run: Scripts/bats.sh "$PWD/dotfiles"
      # Even when the bats suite failed, so both say what differs.
      - name: The script and the binary side by side
        if: ${{ !cancelled() }}
        run: RUN=1 Scripts/compare.sh "$PWD/dotfiles"
