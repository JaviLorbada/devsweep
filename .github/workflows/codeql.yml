name: CodeQL

# GitHub's code scanning for Swift, on every push to main, on pull requests,
# and weekly, so new queries reach code that hasn't changed.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Swift
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write # Uploads the results to code scanning.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: swift
          build-mode: manual
      # SwiftPM runs the program that reads Package.swift inside
      # /usr/bin/sandbox-exec, which macOS 27 won't start with CodeQL's tracer
      # injected ("Bad CPU type"). Without the sandbox it runs directly.
      - name: Build what CodeQL reads
        run: swift build --disable-sandbox
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:swift
