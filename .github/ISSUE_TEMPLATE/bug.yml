name: Bug
description: Something in DevSweep doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If DevSweep deleted, or would delete, something it shouldn't, please don't report it here. Use [Report a vulnerability](https://github.com/JaviLorbada/devsweep/security/advisories/new) instead, as [SECURITY.md](https://github.com/JaviLorbada/devsweep/blob/main/SECURITY.md) describes.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, and what DevSweep did.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - The app
        - The command line tool
        - Both
    validations:
      required: true
  - type: input
    id: devsweep-version
    attributes:
      label: DevSweep version
      description: From its About window, or the release you downloaded.
      placeholder: "0.6.0"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "26.1"
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: What devsweep reports
      description: Optional. The output of `devsweep` on its own, which only reports. Take out anything you'd rather not share, like folder names.
      render: text
