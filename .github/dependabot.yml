# Pull requests when something DevSweep is built with has a new release:
# the Actions the workflows pin to a commit, and swift-argument-parser.
# Each kind comes as one grouped pull request a week.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    groups:
      swift-packages:
        patterns: ["*"]
